services:
  app:
    container_name: magenta-app
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION}
    init: true
    command: node --watch --inspect=${HOSTNAME}:${DEBUG_PORT} index.js
    env_file: ".env"
    environment:
      NODE_ENV: development
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/appdb?authSource=admin
    ports:
      - "${EXT_PORT}:${INT_PORT}"

      - "${HOSTNAME}:${DEBUG_PORT}:${DEBUG_PORT}"
    volumes:
      - ./App:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: magenta-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - ./.mongo:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: magenta-mysql
    restart: unless-stopped
    env_file:
      - ".env"
    ports:
      - "13306:3306"
    volumes:
      - ./.mysql:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  node_modules: